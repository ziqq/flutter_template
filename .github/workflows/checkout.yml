name: Checkout

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
  #    - "develop"
  #    - "feature/**"
  #    - "bugfix/**"
  #    - "hotfix/**"
  #    - "support/**"
  #  paths:
  #    - "pubspec.yaml"
  #    - "pubspec.lock"
  #    - ".github/**.yaml"
  #    - ".github/**.yml"
  #    - "lib/**.dart"
  #    - "test/**.dart"
  #    - "packages/**"
  #    - "web/**"
  #    - "android/**"
  #    - "ios/**"
  #    - "windows/**"
  #    - "linux/**"
  #    - "macos/**"
  pull_request:
    branches:
      - "master"
      - "develop"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/**.yaml"
      - ".github/**.yml"
      - "lib/**.dart"
      - "test/**.dart"
      - "packages/**"
      - "web/**"
      - "android/**"
      - "ios/**"
      - "windows/**"
      - "linux/**"
      - "macos/**"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  checkout:
    name: "🧪 Check code with analysis, format, and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./
    steps:
      - name: 📦 Get the .github actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github

      - name: 🚂 Setup Flutter and dependencies
        uses: ./.github/actions/setup
        with:
          flutter-version: '3.35.5'

      - name: 👀 Check flutter version
        id: check-flutter-version
        run: flutter --version
        timeout-minutes: 1

      - name: 🚦 Check code format
        id: check-format
        timeout-minutes: 1
        run: |
          find lib test -name "*.dart" ! -name "*.*.dart" -print0 | xargs -0 dart format --set-exit-if-changed --line-length 120 -o none

      - name: 📈 Check for Warnings
        id: check-analyzer
        timeout-minutes: 1
        run: |
          flutter analyze --fatal-infos --fatal-warnings lib/ test/

      - name: 🧪 Unit & Widget tests
        timeout-minutes: 20
        run: |
          flutter test --coverage --concurrency=40 test/unit_test.dart test/widget_test.dart

      #- name: 📥 Upload coverage report
      #  timeout-minutes: 5
      #  if: ${{ github.actor != 'dependabot[bot]' }}
      #  uses: codecov/codecov-action@v2
      #  with:
      #    token: ${{ secrets.CODECOV_TOKEN }}
      #    files: ./coverage/lcov.info

      - name: 📥 Upload test report
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && ${{ github.actor != 'dependabot[bot]' }}
        with:
          name: test-results
          path: reports/tests.json


  notify:
    name: Notify CI result
    needs: [checkout]
    continue-on-error: true
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Report missing notification secrets
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS == '' ||
          env.NOTIFY_TELEGRAM_BOT_TOKEN == '' ||
          env.NOTIFY_TELEGRAM_TARGETS == ''
        run: echo "::warning::CI notification skipped because notification secrets are not fully configured."

      - name: Checkout trusted notification template
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        if: >-
          env.NOTIFY_DISCORD_WEBHOOKS != '' &&
          env.NOTIFY_TELEGRAM_BOT_TOKEN != '' &&
          env.NOTIFY_TELEGRAM_TARGETS != '' &&
          hashFiles('.github/notify/templates/ci.md') != ''
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/ci.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: best-effort
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
