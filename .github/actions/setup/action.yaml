name: Setup
description: Sets up the Flutter environment

inputs:
  pub-cache:
    description: 'The name of the pub cache variable'
    required: false
    default: app

runs:
  using: composite
  steps:
    - name: Configure Pub cache
      shell: bash
      run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"

    - name: 🚂 Setup project tools
      uses: jdx/mise-action@v3
      with:
        # Newer Mise releases fail cold Flutter installs on Windows: jdx/mise#14750.
        version: ${{ runner.os == 'Windows' && '2026.8.2' || '' }}

    - name: 📤 Restore Pub modules
      id: cache-pub-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
        key: ${{ runner.os }}-pub-${{ inputs.pub-cache }}-${{ hashFiles('pubspec.lock') }}

    - name: 👷 Install Dependencies
      shell: bash
      run: |
        echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
        dart --disable-analytics
        flutter config --jdk-dir "$JAVA_HOME" --no-cli-animations --no-analytics
        mise exec -- make get

    - name: ⏲️ Run build runner
      shell: bash
      run: |
        mise exec -- make gen

    - name: 📥 Save Pub modules
      id: cache-pub-save
      if: steps.cache-pub-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.PUB_CACHE }}
        key: ${{ steps.cache-pub-restore.outputs.cache-primary-key }}
